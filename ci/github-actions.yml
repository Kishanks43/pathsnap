# CI workflow template.
# Copy this file to .github/workflows/ci.yml to enable GitHub Actions.
# It is kept here because the push token used for this build lacks the
# GitHub 'workflow' scope, which GitHub requires for that path.

name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Unit tests (no raw data needed for these)
        run: python -m pytest -q tests/test_cv.py tests/test_compare.py tests/test_viterbi.py tests/test_api.py tests/test_models.py tests/test_tuning.py
      - name: Lint
        run: |
          pip install ruff
          ruff check src/pathsnap/hmm src/pathsnap/api src/pathsnap/evaluation src/pathsnap/models/tree.py src/pathsnap/tuning

